services:
  postgres:
    image: postgres:17
    container_name: pulsepass-db
    environment:
      POSTGRES_DB: pulsepass
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pulsepass-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pulsepass"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pulsepass-data:
